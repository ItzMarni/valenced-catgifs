name: Release CatGIFs

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catgifs-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Read and validate release version
        id: release
        run: |
          node <<'JS'
          const { readFileSync, appendFileSync } = require('node:fs');
          const manifest = JSON.parse(readFileSync('plugins/catgifs/manifest.json', 'utf8'));
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const { id, version } = manifest;
          if (!/^[a-z0-9]+(?:\.[a-z0-9-]+)+$/.test(id)) throw new Error('Invalid plugin ID.');
          if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[a-z0-9]+)?$/.test(version)) {
            throw new Error('Use a version such as 0.2.2 or 0.3.0-beta in the manifest.');
          }
          if (pkg.version !== version) throw new Error('package.json and manifest.json versions must match.');
          appendFileSync(process.env.GITHUB_OUTPUT, [
            `version=${version}`,
            `tag=v${version}`,
            `asset=dist/${id}-${version}.zip`,
            `prerelease=${version.includes('-')}`,
            '',
          ].join('\n'));
          JS

      - name: Check version has not been tagged
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "::error::$RELEASE_TAG already exists. Bump the version in package.json and plugins/catgifs/manifest.json before releasing again."
            exit 1
          fi

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Build ZIP and run tests
        run: bun run test

      - name: Publish release with ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_ASSET: ${{ steps.release.outputs.asset }}
          RELEASE_PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          args=(release create "$RELEASE_TAG" "$RELEASE_ASSET"
            --target "$GITHUB_SHA"
            --title "CatGIFs $RELEASE_VERSION"
            --generate-notes)
          if [[ "$RELEASE_PRERELEASE" == 'true' ]]; then
            args+=(--prerelease --latest=false)
          fi
          gh "${args[@]}"
